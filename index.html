<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower Defense</title>
<style>
  body {
    background: #222;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 15px;
  }
  #game-wrapper {
    display: inline-block;
    background: #333;
    padding: 15px;
    border-radius: 8px;
  }
  canvas {
    background: #4a7c59;
    border: 3px solid #111;
    display: block;
    margin: 0 auto 10px auto;
  }
  .hud {
    font-size: 18px;
    margin-bottom: 10px;
    font-weight: bold;
  }
  .panel-section {
    background: #444;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    text-align: left;
  }
  .panel-section h4 {
    margin: 0 0 5px 0;
    color: #ffd700;
  }
  button {
    background: #555;
    color: #fff;
    border: 1px solid #777;
    padding: 6px 10px;
    margin: 3px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
  }
  button:hover:not(:disabled) {
    background: #777;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .active-btn {
    border-color: #ffd700;
    background: #665500;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div class="hud">
    Tokens: <span id="tokens-val">60</span> | Towers: <span id="towers-val">1</span>/2
  </div>

  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <!-- INTEGRATED BUY & UPGRADE MENU -->
  <div class="panel-section">
    <h4>Build Menu</h4>
    <button id="btn-mode-outpost" onclick="setBuildMode('outpost')">Build Outpost Tower (20 tokens)</button>
    <button id="btn-mode-spikes" onclick="setBuildMode('spikes')">Buy Spike Trap (15 tokens) [<span id="spike-count">0</span>/4]</button>
  </div>

  <div class="panel-section">
    <h4>Upgrades Menu</h4>
    <button onclick="upgradeCastle()">Castle +Dmg (10 tokens)</button>
    <button id="btn-upg-outpost" onclick="toggleOutpostUpgradeMenu()">Outpost Upgrades</button>
    <button id="btn-upg-spikes" onclick="toggleSpikeUpgradeMenu()">Spike Trap Upgrades</button>

    <!-- Sub-menu for Outpost Tower -->
    <div id="sub-outpost" style="display:none; margin-top:8px; padding-top:5px; border-top:1px solid #666;">
      <strong>Outpost Upgrades:</strong>
      <button id="btn-outpost-dmg" onclick="upgradeOutpost()">+Damage (10 tokens)</button>
    </div>

    <!-- Sub-menu for Spike Traps -->
    <div id="sub-spikes" style="display:none; margin-top:8px; padding-top:5px; border-top:1px solid #666;">
      <strong>Spike Trap Upgrades:</strong>
      <button id="btn-spk-unlock" onclick="unlockSpikeDamage()">Unlock Tick Damage (10 tokens)</button>
      <button id="btn-spk-dmg" onclick="upgradeSpikeDamage()" disabled>+Tick Dmg (5 tokens) [Lvl <span id="spk-lvl">0</span>/5]</button>
      <button id="btn-spk-slow" onclick="upgradeSpikeSlow()">Extra Slowdown (10 tokens)</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let tokens = 60;
let buildMode = null; // 'outpost' or 'spikes'

// Tower settings: range lowered (85px), total count capped at 2
const MAX_TOWERS = 2;
const LOWERED_RANGE = 85;

let towers = [
  { id: 'main', type: 'castle', x: 500, y: 200, range: LOWERED_RANGE, damage: 15, cooldown: 0, fireRate: 30 }
];

let spikes = [];
const MAX_SPIKES = 4;

let spikeUpgrades = {
  tickUnlocked: false,
  tickDmg: 0,
  tickLvl: 0,
  maxTickLvl: 5,
  slowFactor: 0.5,
  extraSlowBought: false
};

let enemies = [];
let spawnTimer = 0;

const path = [
  {x: 0, y: 80},
  {x: 220, y: 80},
  {x: 220, y: 320},
  {x: 500, y: 320},
  {x: 500, y: 200}
];

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (buildMode === 'outpost') {
    if (towers.length < MAX_TOWERS && tokens >= 20) {
      towers.push({
        id: 'outpost',
        type: 'outpost',
        x: x,
        y: y,
        range: LOWERED_RANGE,
        damage: 10,
        cooldown: 0,
        fireRate: 35
      });
      tokens -= 20;
      buildMode = null;
      updateUI();
    }
  } else if (buildMode === 'spikes') {
    if (spikes.length < MAX_SPIKES && tokens >= 15) {
      spikes.push({ x: x, y: y, radius: 22 });
      tokens -= 15;
      buildMode = null;
      updateUI();
    }
  }
});

function setBuildMode(mode) {
  buildMode = (buildMode === mode) ? null : mode;
  updateUI();
}

function toggleOutpostUpgradeMenu() {
  const sub = document.getElementById('sub-outpost');
  sub.style.display = (sub.style.display === 'none') ? 'block' : 'none';
}

function toggleSpikeUpgradeMenu() {
  const sub = document.getElementById('sub-spikes');
  sub.style.display = (sub.style.display === 'none') ? 'block' : 'none';
}

function upgradeCastle() {
  const castle = towers.find(t => t.type === 'castle');
  if (castle && tokens >= 10) {
    tokens -= 10;
    castle.damage += 5;
    updateUI();
  }
}

function upgradeOutpost() {
  const outpost = towers.find(t => t.type === 'outpost');
  if (outpost && tokens >= 10) {
    tokens -= 10;
    outpost.damage += 4;
    updateUI();
  }
}

function unlockSpikeDamage() {
  if (!spikeUpgrades.tickUnlocked && tokens >= 10) {
    tokens -= 10;
    spikeUpgrades.tickUnlocked = true;
    spikeUpgrades.tickDmg = 2;
    spikeUpgrades.tickLvl = 1;
    updateUI();
  }
}

function upgradeSpikeDamage() {
  if (spikeUpgrades.tickUnlocked && spikeUpgrades.tickLvl < spikeUpgrades.maxTickLvl && tokens >= 5) {
    tokens -= 5;
    spikeUpgrades.tickLvl++;
    spikeUpgrades.tickDmg += 2; // Capped max = 10 tick damage
    updateUI();
  }
}

function upgradeSpikeSlow() {
  if (!spikeUpgrades.extraSlowBought && tokens >= 10) {
    tokens -= 10;
    spikeUpgrades.extraSlowBought = true;
    spikeUpgrades.slowFactor = 0.25; // 75% speed reduction
    updateUI();
  }
}

function update() {
  spawnTimer++;
  if (spawnTimer > 90) {
    enemies.push({
      x: path[0].x,
      y: path[0].y,
      pathIdx: 0,
      hp: 40,
      maxHp: 40,
      speed: 1.6,
      currentSpeed: 1.6
    });
    spawnTimer = 0;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    e.currentSpeed = e.speed;

    // Spike trap interactions
    spikes.forEach(s => {
      let dist = Math.hypot(e.x - s.x, e.y - s.y);
      if (dist < s.radius) {
        e.currentSpeed = e.speed * spikeUpgrades.slowFactor;
        if (spikeUpgrades.tickUnlocked) {
          e.hp -= spikeUpgrades.tickDmg / 30;
        }
      }
    });

    let target = path[e.pathIdx + 1];
    if (target) {
      let dx = target.x - e.x;
      let dy = target.y - e.y;
      let dist = Math.hypot(dx, dy);

      if (dist < e.currentSpeed) {
        e.pathIdx++;
      } else {
        e.x += (dx / dist) * e.currentSpeed;
        e.y += (dy / dist) * e.currentSpeed;
      }
    } else {
      enemies.splice(i, 1);
      continue;
    }

    if (e.hp <= 0) {
      enemies.splice(i, 1);
      tokens += 5;
      updateUI();
    }
  }

  towers.forEach(t => {
    if (t.cooldown > 0) t.cooldown--;
    else {
      let target = enemies.find(e => Math.hypot(e.x - t.x, e.y - t.y) <= t.range);
      if (target) {
        target.hp -= t.damage;
        t.cooldown = t.fireRate;
      }
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Path
  ctx.strokeStyle = '#8b939c';
  ctx.lineWidth = 26;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  path.forEach((p, idx) => {
    if (idx === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();

  // Spikes
  spikes.forEach(s => {
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.fill();

    // Metallic spike details
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 2;
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
      let px = s.x + Math.cos(a) * (s.radius - 3);
      let py = s.y + Math.sin(a) * (s.radius - 3);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(px, py);
      ctx.stroke();
    }
  });

  // Towers
  towers.forEach(t => {
    // Range ring
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.stroke();

    if (t.type === 'castle') {
      // Main Castle visual
      ctx.fillStyle = '#777';
      ctx.fillRect(t.x - 20, t.y - 20, 40, 40);
      
      ctx.fillStyle = '#444';
      ctx.fillRect(t.x - 22, t.y - 22, 10, 10);
      ctx.fillRect(t.x + 12, t.y - 22, 10, 10);
      ctx.fillRect(t.x - 22, t.y + 12, 10, 10);
      ctx.fillRect(t.x + 12, t.y + 12, 10, 10);

      ctx.fillStyle = '#332211';
      ctx.fillRect(t.x - 6, t.y + 8, 12, 12);
    } else if (t.type === 'outpost') {
      // Extra Outpost visual
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(t.x - 12, t.y + 15); ctx.lineTo(t.x, t.y - 8);
      ctx.moveTo(t.x + 12, t.y + 15); ctx.lineTo(t.x, t.y - 8);
      ctx.stroke();

      ctx.fillStyle = '#A0522D';
      ctx.fillRect(t.x - 14, t.y - 10, 28, 10);

      ctx.fillStyle = '#CD853F';
      ctx.beginPath();
      ctx.moveTo(t.x - 16, t.y - 10);
      ctx.lineTo(t.x, t.y - 22);
      ctx.lineTo(t.x + 16, t.y - 10);
      ctx.closePath();
      ctx.fill();
    }
  });

  // Enemies
  enemies.forEach(e => {
    ctx.fillStyle = '#d9534f';
    ctx.beginPath();
    ctx.arc(e.x, e.y, 8, 0, Math.PI * 2);
    ctx.fill();

    // HP Bar
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - 10, e.y - 14, 20, 3);
    ctx.fillStyle = '#5cb85c';
    ctx.fillRect(e.x - 10, e.y - 14, (e.hp / e.maxHp) * 20, 3);
  });
}

function updateUI() {
  document.getElementById('tokens-val').innerText = Math.floor(tokens);
  document.getElementById('towers-val').innerText = towers.length;
  document.getElementById('spike-count').innerText = spikes.length;

  document.getElementById('btn-mode-outpost').disabled = (towers.length >= MAX_TOWERS || tokens < 20);
  document.getElementById('btn-mode-outpost').classList.toggle('active-btn', buildMode === 'outpost');

  document.getElementById('btn-mode-spikes').disabled = (spikes.length >= MAX_SPIKES || tokens < 15);
  document.getElementById('btn-mode-spikes').classList.toggle('active-btn', buildMode === 'spikes');

  const hasOutpost = towers.some(t => t.type === 'outpost');
  document.getElementById('btn-outpost-dmg').disabled = (!hasOutpost || tokens < 10);

  document.getElementById('btn-spk-unlock').disabled = (spikeUpgrades.tickUnlocked || tokens < 10);
  
  document.getElementById('spk-lvl').innerText = spikeUpgrades.tickLvl;
  document.getElementById('btn-spk-dmg').disabled = (!spikeUpgrades.tickUnlocked || spikeUpgrades.tickLvl >= spikeUpgrades.maxTickLvl || tokens < 5);

  document.getElementById('btn-spk-slow').disabled = (spikeUpgrades.extraSlowBought || tokens < 10);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

updateUI();
loop();
</script>
</body>
</html>
