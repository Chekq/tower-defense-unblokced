<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense Game</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #1e1e24;
    color: #f0f0f0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
  }
  #game-container {
    display: flex;
    gap: 20px;
  }
  canvas {
    background: #3a5a40;
    border: 4px solid #14213d;
    border-radius: 8px;
    cursor: crosshair;
  }
  #sidebar {
    width: 310px;
    background: #2b2d42;
    padding: 15px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .hud-box {
    background: #8d99ae;
    color: #111;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
  }
  .menu-card {
    background: #1d3557;
    border-radius: 6px;
    padding: 10px;
    border: 1px solid #457b9d;
  }
  .menu-card h3 {
    margin: 0 0 8px 0;
    color: #fca311;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  button {
    width: 100%;
    padding: 8px 10px;
    margin: 4px 0;
    background: #e63946;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    transition: background 0.2s;
  }
  button:hover:not(:disabled) {
    background: #d62828;
  }
  button:disabled {
    background: #555;
    cursor: not-allowed;
    opacity: 0.6;
  }
  .btn-buy {
    background: #2a9d8f;
  }
  .btn-buy:hover:not(:disabled) {
    background: #218380;
  }
  .btn-active {
    outline: 2px solid #fca311;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="600" height="500"></canvas>
  
  <div id="sidebar">
    <div class="hud-box">
      <span>Tokens: <span id="token-count">60</span></span>
      <span>Towers: <span id="tower-count">1</span>/2</span>
    </div>

    <!-- BUILD MENU -->
    <div class="menu-card">
      <h3>Build Options</h3>
      <button id="btn-build-outpost" class="btn-buy" onclick="setBuildMode('outpost')">Build Outpost Tower (20 Tokens)</button>
      <button id="btn-build-spikes" class="btn-buy" onclick="setBuildMode('spikes')">Buy Spike Trap (15 Tokens) [<span id="spike-count">0</span>/4]</button>
    </div>

    <!-- MAIN CASTLE MENU -->
    <div class="menu-card">
      <h3>Main Castle</h3>
      <button onclick="upgradeCastleDamage()">+Damage (10 Tokens)</button>
    </div>

    <!-- EXTRA TOWER MENU -->
    <div class="menu-card">
      <h3>Outpost Tower</h3>
      <button id="btn-upg-outpost-dmg" onclick="upgradeOutpostDamage()" disabled>+Damage (10 Tokens)</button>
    </div>

    <!-- SPIKE TRAPS MENU -->
    <div class="menu-card">
      <h3>Spike Traps</h3>
      <button id="btn-spk-unlock-dmg" onclick="unlockSpikeDamage()">Unlock Tick Damage (10 Tokens)</button>
      <button id="btn-spk-upg-dmg" onclick="upgradeSpikeDamage()" disabled>+Tick Damage (5 Tokens) [Level <span id="spk-dmg-lvl">0</span>]</button>
      <button id="btn-spk-upg-slow" onclick="upgradeSpikeSlow()">+Extra Slowdown (10 Tokens)</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let tokens = 60;
let buildMode = null; // 'outpost' or 'spikes'

// --- TOWER LIMIT & RANGE SETTINGS ---
const MAX_TOWERS = 2; // Main Castle + 1 Outpost
const LOWERED_RANGE = 90; // Reduced tower range

// Game Entities
let towers = [
  { id: 'main', type: 'castle', x: 500, y: 250, range: LOWERED_RANGE, damage: 15, cooldown: 0, fireRate: 30 }
];

let spikes = []; // Max 4
const MAX_SPIKES = 4;

// Spike Upgrade System Properties
let spikeUpgrades = {
  tickDamageUnlocked: false,
  tickDamage: 0,
  tickDamageLevel: 0,
  maxTickDamageLevel: 5, // Reasonable damage cap
  slowMultiplier: 0.5,  // Base slow down (50% speed)
  extraSlowPurchased: false
};

let enemies = [];
let spawnTimer = 0;

// Path waypoints for enemies
const path = [
  {x: 0, y: 100},
  {x: 200, y: 100},
  {x: 200, y: 380},
  {x: 500, y: 380},
  {x: 500, y: 250}
];

// Handle map clicks for placing items
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  if (buildMode === 'outpost') {
    if (towers.length < MAX_TOWERS && tokens >= 20) {
      towers.push({
        id: 'outpost',
        type: 'outpost',
        x: clickX,
        y: clickY,
        range: LOWERED_RANGE,
        damage: 10,
        cooldown: 0,
        fireRate: 40
      });
      tokens -= 20;
      buildMode = null;
      updateUI();
    }
  } else if (buildMode === 'spikes') {
    if (spikes.length < MAX_SPIKES && tokens >= 15) {
      spikes.push({ x: clickX, y: clickY, size: 24 });
      tokens -= 15;
      buildMode = null;
      updateUI();
    }
  }
});

function setBuildMode(mode) {
  buildMode = (buildMode === mode) ? null : mode;
  updateUI();
}

// --- UPGRADE FUNCTIONS ---
function upgradeCastleDamage() {
  const main = towers.find(t => t.type === 'castle');
  if (main && tokens >= 10) {
    tokens -= 10;
    main.damage += 5;
    updateUI();
  }
}

function upgradeOutpostDamage() {
  const outpost = towers.find(t => t.type === 'outpost');
  if (outpost && tokens >= 10) {
    tokens -= 10;
    outpost.damage += 4;
    updateUI();
  }
}

function unlockSpikeDamage() {
  if (!spikeUpgrades.tickDamageUnlocked && tokens >= 10) {
    tokens -= 10;
    spikeUpgrades.tickDamageUnlocked = true;
    spikeUpgrades.tickDamage = 2;
    spikeUpgrades.tickDamageLevel = 1;
    updateUI();
  }
}

function upgradeSpikeDamage() {
  if (spikeUpgrades.tickDamageUnlocked && spikeUpgrades.tickDamageLevel < spikeUpgrades.maxTickDamageLevel && tokens >= 5) {
    tokens -= 5;
    spikeUpgrades.tickDamageLevel++;
    spikeUpgrades.tickDamage += 2; // Capped max tick damage = 10
    updateUI();
  }
}

function upgradeSpikeSlow() {
  if (!spikeUpgrades.extraSlowPurchased && tokens >= 10) {
    tokens -= 10;
    spikeUpgrades.extraSlowPurchased = true;
    spikeUpgrades.slowMultiplier = 0.25; // Slows enemy down to 25% speed
    updateUI();
  }
}

// --- GAME LOOP & UPDATES ---
function update() {
  // Spawn enemies
  spawnTimer++;
  if (spawnTimer > 100) {
    enemies.push({
      x: path[0].x,
      y: path[0].y,
      pathIndex: 0,
      hp: 50,
      maxHp: 50,
      baseSpeed: 1.5,
      currentSpeed: 1.5
    });
    spawnTimer = 0;
  }

  // Enemy movement & traps interaction
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    e.currentSpeed = e.baseSpeed;

    // Check interaction with spike traps
    spikes.forEach(spike => {
      let dist = Math.hypot(e.x - spike.x, e.y - spike.y);
      if (dist < spike.size) {
        // Apply Slowdown
        e.currentSpeed = e.baseSpeed * spikeUpgrades.slowMultiplier;
        
        // Apply Tick Damage if unlocked
        if (spikeUpgrades.tickDamageUnlocked) {
          e.hp -= spikeUpgrades.tickDamage / 30; // Scale tick damage per frame
        }
      }
    });

    // Advance position along path
    let target = path[e.pathIndex + 1];
    if (target) {
      let dx = target.x - e.x;
      let dy = target.y - e.y;
      let dist = Math.hypot(dx, dy);

      if (dist < e.currentSpeed) {
        e.pathIndex++;
      } else {
        e.x += (dx / dist) * e.currentSpeed;
        e.y += (dy / dist) * e.currentSpeed;
      }
    } else {
      // Reached castle end
      enemies.splice(i, 1);
      continue;
    }

    if (e.hp <= 0) {
      enemies.splice(i, 1);
      tokens += 5;
      updateUI();
    }
  }

  // Towers attack targeting
  towers.forEach(t => {
    if (t.cooldown > 0) t.cooldown--;
    else {
      let target = enemies.find(e => Math.hypot(e.x - t.x, e.y - t.y) <= t.range);
      if (target) {
        target.hp -= t.damage;
        t.cooldown = t.fireRate;
      }
    }
  });
}

// --- RENDERING ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Path
  ctx.strokeStyle = '#a3b18a';
  ctx.lineWidth = 30;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  path.forEach((p, index) => {
    if (index === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();

  // Draw Spikes
  spikes.forEach(s => {
    ctx.fillStyle = '#7209b7';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();

    // Draw metallic spike details
    ctx.strokeStyle = '#4cc9f0';
    ctx.lineWidth = 2;
    for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
      let sx = s.x + Math.cos(angle) * (s.size - 4);
      let sy = s.y + Math.sin(angle) * (s.size - 4);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(sx, sy);
      ctx.stroke();
    }
  });

  // Draw Towers
  towers.forEach(t => {
    // Range circle outline
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.stroke();

    if (t.type === 'castle') {
      // --- DRAW CASTLE VISUALS ---
      // Castle base
      ctx.fillStyle = '#6c757d';
      ctx.fillRect(t.x - 25, t.y - 25, 50, 50);
      
      // Battlements / Turrets
      ctx.fillStyle = '#495057';
      ctx.fillRect(t.x - 27, t.y - 27, 12, 12);
      ctx.fillRect(t.x + 15, t.y - 27, 12, 12);
      ctx.fillRect(t.x - 27, t.y + 15, 12, 12);
      ctx.fillRect(t.x + 15, t.y + 15, 12, 12);

      // Wooden Keep Door
      ctx.fillStyle = '#3d0c02';
      ctx.fillRect(t.x - 7, t.y + 10, 14, 15);

      // Flag
      ctx.strokeStyle = '#d62828';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(t.x, t.y - 5);
      ctx.lineTo(t.x + 12, t.y - 10);
      ctx.lineTo(t.x, t.y - 15);
      ctx.fillStyle = '#d62828';
      ctx.fill();
    } 
    else if (t.type === 'outpost') {
      // --- DRAW OUTPOST VISUALS ---
      // Wooden Support Beams
      ctx.strokeStyle = '#7f4f24';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(t.x - 15, t.y + 18); ctx.lineTo(t.x, t.y - 10);
      ctx.moveTo(t.x + 15, t.y + 18); ctx.lineTo(t.x, t.y - 10);
      ctx.stroke();

      // Platform
      ctx.fillStyle = '#936639';
      ctx.fillRect(t.x - 16, t.y - 12, 32, 12);

      // Thatched Watchtower Roof
      ctx.fillStyle = '#b08968';
      ctx.beginPath();
      ctx.moveTo(t.x - 20, t.y - 12);
      ctx.lineTo(t.x, t.y - 28);
      ctx.lineTo(t.x + 20, t.y - 12);
      ctx.closePath();
      ctx.fill();
    }
  });

  // Draw Enemies
  enemies.forEach(e => {
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.arc(e.x, e.y, 10, 0, Math.PI * 2);
    ctx.fill();

    // HP Bar
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - 12, e.y - 18, 24, 4);
    ctx.fillStyle = '#00f5d4';
    ctx.fillRect(e.x - 12, e.y - 18, (e.hp / e.maxHp) * 24, 4);
  });
}

function updateUI() {
  document.getElementById('token-count').innerText = tokens;
  document.getElementById('tower-count').innerText = towers.length;
  document.getElementById('spike-count').innerText = spikes.length;

  // Build Buttons State
  const outpostBtn = document.getElementById('btn-build-outpost');
  outpostBtn.disabled = (towers.length >= MAX_TOWERS || tokens < 20);
  outpostBtn.classList.toggle('btn-active', buildMode === 'outpost');

  const spikeBtn = document.getElementById('btn-build-spikes');
  spikeBtn.disabled = (spikes.length >= MAX_SPIKES || tokens < 15);
  spikeBtn.classList.toggle('btn-active', buildMode === 'spikes');

  // Outpost Upgrade Button State
  const hasOutpost = towers.some(t => t.type === 'outpost');
  document.getElementById('btn-upg-outpost-dmg').disabled = (!hasOutpost || tokens < 10);

  // Spike Upgrades State
  const unlockDmgBtn = document.getElementById('btn-spk-unlock-dmg');
  unlockDmgBtn.disabled = (spikeUpgrades.tickDamageUnlocked || tokens < 10);

  const upgDmgBtn = document.getElementById('btn-spk-upg-dmg');
  document.getElementById('spk-dmg-lvl').innerText = spikeUpgrades.tickDamageLevel;
  upgDmgBtn.disabled = (!spikeUpgrades.tickDamageUnlocked || spikeUpgrades.tickDamageLevel >= spikeUpgrades.maxTickDamageLevel || tokens < 5);

  const upgSlowBtn = document.getElementById('btn-spk-upg-slow');
  upgSlowBtn.disabled = (spikeUpgrades.extraSlowPurchased || tokens < 10);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();
</script>
</body>
</html>
